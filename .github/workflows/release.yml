name: Release Godbot
# Push a tag vX.Y.Z (matching package.json) to publish the packed plugin as a
# GitHub release. Installed Godbots find it through the releases API, check the
# archive against the SHA-256 GitHub records for it (and the .sha256 beside it),
# and install it through DSH's plugin manager.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v0.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Check the tag names the package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm install -g pnpm@11.1.2 @deepseek-ai/dsh@$(node -p "require('./package.json').engines.dsh")
      - run: npm ci
      - name: Install Chromium matched to the locked Playwright version
        run: npx --no-install playwright-core install --no-shell chromium
      - run: npm test
      - run: npm run build
      - name: Pack the plugin
        shell: bash
        run: |
          mkdir -p dist
          package=$(npm pack --pack-destination dist --silent)
          test "$package" = "dsh-godbot-$VERSION.tgz"
          node scripts/check-bundled-host-package.mjs "dist/$package" --require-encoder
          (cd dist && shasum -a 256 "$package" > "$package.sha256" && cat "$package.sha256")
          node --input-type=module -e "import { verifyEncoderDistribution } from './computer-host/bundled-encoder.js'; verifyEncoderDistribution(undefined, { sources: true })"
          (cd computer-host/bundled-encoder && shasum -a 256 ffmpeg-8.0.1.tar.xz libvpx-v1.17.0.tar.gz) > dist/godbot-mac-encoder-source.sha256
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          assets=(
            "dist/dsh-godbot-$VERSION.tgz"
            "dist/dsh-godbot-$VERSION.tgz.sha256"
            computer-host/bundled-encoder/ffmpeg-8.0.1.tar.xz
            computer-host/bundled-encoder/libvpx-v1.17.0.tar.gz
            dist/godbot-mac-encoder-source.sha256
          )
          source_notes='The corresponding source for the bundled Mac video encoder is attached as `ffmpeg-8.0.1.tar.xz` and `libvpx-v1.17.0.tar.gz`. Their checksums are in `godbot-mac-encoder-source.sha256`.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            notes=$(mktemp)
            gh release view "$TAG" --json body --jq .body > "$notes"
            if ! grep -Fq "$source_notes" "$notes"; then
              printf '\n%s\n' "$source_notes" >> "$notes"
              gh release edit "$TAG" --notes-file "$notes"
            fi
            rm -f "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --title "Godbot $VERSION" \
              --generate-notes --notes "$source_notes" --verify-tag "${flags[@]}"
          fi
