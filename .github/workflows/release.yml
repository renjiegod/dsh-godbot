name: Release Godbot
# Publishing promotes a verified candidate; it never builds or uploads. Before the
# tag vX.Y.Z (matching package.json) is pushed, candidate.yml has staged that
# version on a draft release with candidate.json, and the strict release e2e
# suite's verification.json was attached to the same draft. This workflow
# publishes the draft only when the tag points at the candidate's commit on main,
# the archive's bytes match the SHA-256 that GitHub, candidate.json, the .sha256
# beside it and verification.json all state, and no newer release is out. A
# published release is never changed: run it again and it only re-checks.
#
# Installed Godbots find the published release through the releases API and check
# the archive against the SHA-256 GitHub records for it (and the .sha256 beside
# it); the last step reads the release back exactly that way.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish or re-check, such as v0.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: godbot-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Check the tag names the package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Publish the verified candidate
        run: node scripts/release-candidate.mjs promote --repo "$GITHUB_REPOSITORY" --tag "$TAG"
      - name: Read the release back as installed Godbots see it
        shell: bash
        run: |
          # The release list can take a moment to show a release just published.
          for attempt in 1 2 3; do
            if node scripts/release-candidate.mjs readback --repo "$GITHUB_REPOSITORY" --tag "$TAG" > readback.json; then
              cat readback.json
              {
                echo "### Godbot ${TAG#v} published"
                echo
                echo '```json'
                cat readback.json
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$TAG is published but did not read back as installed Godbots would see it"
          exit 1
