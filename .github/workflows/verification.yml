name: Verify Godbot package
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Every push and pull request: unit and integration tests, the client build
  # and a dry-run of the npm package.
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm install -g pnpm@11.1.2 "@deepseek-ai/dsh@$(node -p "require('./package.json').godbot.verifiedDsh")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts

  linux-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.2-rc.2, 0.2.2-rc.5]
    env:
      DSH_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm install -g pnpm@11.1.2 "@deepseek-ai/dsh@$DSH_VERSION"
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps --no-shell chromium
      - run: npm run test:e2e -- --case E0

  # The packaged browser end-to-end suite is long-running, so it only runs when
  # started by hand from the Actions tab (Run workflow).
  packaged-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm install -g pnpm@11.1.2 "@deepseek-ai/dsh@$(node -p "require('./package.json').godbot.verifiedDsh")"
      - run: npm ci
      - name: Install Chromium matched to the locked Playwright version
        run: npx --no-install playwright-core install --no-shell chromium
      - run: npm run build
      - name: Pack and test the uploaded candidate
        shell: bash
        run: |
          mkdir -p verify
          version=$(node -p "require('./package.json').version")
          package="dsh-godbot-$version.tgz"
          npm pack --pack-destination verify --silent
          node scripts/check-bundled-host-package.mjs "verify/$package" --require-encoder
          npm run test:e2e -- --artifact "$PWD/verify/$package" --suite release --report-dir "$PWD/verify/release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godbot-package-and-report
          path: verify/
